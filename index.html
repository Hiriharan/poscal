<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PosCal" />
  <meta name="description" content="ICT Position Size Calculator — XAUUSD, EURUSD, GBPUSD" />
  <title>PosCal</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface2: #1c1c1c;
      --border: rgba(255,255,255,0.07);
      --border2: rgba(255,255,255,0.12);
      --text: #f0f0f0;
      --muted: #666;
      --muted2: #888;
      --accent: #c8f135;
      --accent-dim: rgba(200,241,53,0.12);
      --accent-dim2: rgba(200,241,53,0.06);
      --red: #ff4d4d;
      --red-dim: rgba(255,77,77,0.12);
      --amber: #f5a623;
      --amber-dim: rgba(245,166,35,0.12);
      --mono: 'Space Mono', monospace;
      --sans: 'DM Sans', sans-serif;
      --radius: 12px;
      --radius-sm: 8px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    body {
      min-height: 100dvh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-top: 8px;
    }

    .logo {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .logo-mark {
      font-family: var(--mono);
      font-size: 22px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -1px;
    }

    .logo-sub {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: .08em;
      text-transform: uppercase;
      font-weight: 500;
    }

    .day-badge {
      font-family: var(--mono);
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--border2);
      color: var(--muted2);
      letter-spacing: .04em;
    }

    .day-badge.warn {
      border-color: var(--amber);
      color: var(--amber);
      background: var(--amber-dim);
    }

    /* Section card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 12px;
      overflow: hidden;
    }

    .card-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 12px 16px 0;
    }

    /* Pair selector */
    .pair-row {
      display: flex;
      gap: 8px;
      padding: 10px 16px 14px;
    }

    .pair-btn {
      flex: 1;
      height: 38px;
      border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--muted2);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all .15s;
      letter-spacing: .02em;
    }

    .pair-btn.active {
      border-color: var(--accent);
      background: var(--accent-dim);
      color: var(--accent);
    }

    /* Input fields */
    .fields {
      padding: 0 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .field {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 0;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }

    .field:last-child { border-bottom: none; }

    .field-label {
      font-size: 13px;
      color: var(--muted2);
      white-space: nowrap;
      flex-shrink: 0;
      font-weight: 400;
    }

    .field-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .field input {
      width: 120px;
      height: 36px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 700;
      text-align: right;
      padding: 0 10px;
      outline: none;
      -webkit-appearance: none;
      transition: border-color .15s;
    }

    .field input:focus {
      border-color: var(--accent);
    }

    .field-unit {
      font-size: 11px;
      color: var(--muted);
      width: 24px;
      text-align: left;
      font-weight: 500;
    }

    /* Mode toggle */
    .mode-toggle {
      display: flex;
      gap: 6px;
      padding: 10px 16px 14px;
    }

    .mode-btn {
      flex: 1;
      height: 34px;
      border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--muted2);
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all .15s;
    }

    .mode-btn.active {
      border-color: var(--accent);
      background: var(--accent-dim);
      color: var(--accent);
    }

    /* Results */
    .results {
      padding: 0 16px 4px;
    }

    .result-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 0;
      border-bottom: 1px solid var(--border);
    }

    .result-row:last-child { border-bottom: none; }

    .result-label {
      font-size: 13px;
      color: var(--muted2);
    }

    .result-val {
      font-family: var(--mono);
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }

    .result-val.green { color: var(--accent); }
    .result-val.amber { color: var(--amber); }
    .result-val.red   { color: var(--red); }

    /* Big lot display */
    .lot-hero {
      padding: 20px 16px 16px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    .lot-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .lot-number {
      font-family: var(--mono);
      font-size: 48px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -2px;
      line-height: 1;
    }

    .lot-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
      font-family: var(--mono);
    }

    /* Rule bar */
    .rule-bar {
      margin-top: 12px;
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
    }

    .rule-bar.ok {
      background: var(--accent-dim2);
      border-color: rgba(200,241,53,0.2);
      color: var(--accent);
    }

    .rule-bar.warn {
      background: var(--amber-dim);
      border-color: rgba(245,166,35,0.25);
      color: var(--amber);
    }

    .rule-bar.bad {
      background: var(--red-dim);
      border-color: rgba(255,77,77,0.25);
      color: var(--red);
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
      background: currentColor;
    }

    /* RR presets */
    .rr-presets {
      display: flex;
      gap: 6px;
      padding: 10px 16px 14px;
      flex-wrap: wrap;
    }

    .rr-btn {
      height: 32px;
      padding: 0 14px;
      border: 1px solid var(--border2);
      border-radius: 20px;
      background: transparent;
      color: var(--muted2);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all .15s;
    }

    .rr-btn.active {
      border-color: var(--accent);
      background: var(--accent-dim);
      color: var(--accent);
    }

    /* Divider label */
    .divider-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 12px 16px 4px;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
<div class="app">

  <header class="header">
    <div class="logo">
      <span class="logo-mark">PosCal</span>
      <span class="logo-sub">by Hiri</span>
    </div>
    <div class="day-badge" id="dayBadge">—</div>
  </header>

  <!-- Pair -->
  <div class="card">
    <div class="card-label">Instrument</div>
    <div class="pair-row">
      <button class="pair-btn active" onclick="setPair('XAUUSD',this)">XAUUSD</button>
      <button class="pair-btn" onclick="setPair('EURUSD',this)">EURUSD</button>
      <button class="pair-btn" onclick="setPair('GBPUSD',this)">GBPUSD</button>
    </div>
  </div>

  <!-- Account -->
  <div class="card">
    <div class="card-label">Account</div>
    <div class="mode-toggle">
      <button class="mode-btn active" id="btnPct" onclick="setMode('pct')">% Risk</button>
      <button class="mode-btn" id="btnAmt" onclick="setMode('amt')">$ Amount</button>
    </div>
    <div class="fields">
      <div class="field">
        <span class="field-label">Capital</span>
        <div class="field-right">
          <input type="number" id="balance" value="25000" inputmode="decimal" oninput="calc()" />
          <span class="field-unit">USD</span>
        </div>
      </div>
      <div class="field" id="pctField">
        <span class="field-label">Risk</span>
        <div class="field-right">
          <input type="number" id="riskPct" value="0.5" step="0.1" inputmode="decimal" oninput="calc()" />
          <span class="field-unit">%</span>
        </div>
      </div>
      <div class="field" id="amtField" style="display:none">
        <span class="field-label">Risk $</span>
        <div class="field-right">
          <input type="number" id="riskAmt" value="125" inputmode="decimal" oninput="calc()" />
          <span class="field-unit">USD</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Trade -->
  <div class="card">
    <div class="card-label">Trade — from TradingView</div>
    <div class="fields">
      <div class="field">
        <span class="field-label">SL distance</span>
        <div class="field-right">
          <input type="number" id="slPips" value="1.5" step="0.1" inputmode="decimal" oninput="calc()" />
          <span class="field-unit">pips</span>
        </div>
      </div>
      <div class="field">
        <span class="field-label">TP distance</span>
        <div class="field-right">
          <input type="number" id="tpPips" value="4.4" step="0.1" inputmode="decimal" oninput="calc()" />
          <span class="field-unit">pips</span>
        </div>
      </div>
    </div>
    <div class="divider-label">R:R preset — auto-fills TP</div>
    <div class="rr-presets" id="rrPresets">
      <button class="rr-btn" onclick="setRR(1,this)">1R</button>
      <button class="rr-btn" onclick="setRR(1.5,this)">1.5R</button>
      <button class="rr-btn active" onclick="setRR(2,this)">2R</button>
      <button class="rr-btn" onclick="setRR(3,this)">3R</button>
      <button class="rr-btn" onclick="setRR(5,this)">5R</button>
    </div>
  </div>

  <!-- Result hero -->
  <div class="card">
    <div class="lot-hero">
      <div class="lot-label">Lot size</div>
      <div class="lot-number" id="rLot">—</div>
      <div class="lot-sub" id="rUnits">— units</div>
    </div>
    <div class="results">
      <div class="result-row">
        <span class="result-label">Risk amount</span>
        <span class="result-val" id="rRisk">—</span>
      </div>
      <div class="result-row">
        <span class="result-label">R:R ratio</span>
        <span class="result-val" id="rRR">—</span>
      </div>
      <div class="result-row">
        <span class="result-label">Potential profit</span>
        <span class="result-val green" id="rProfit">—</span>
      </div>
    </div>
  </div>

  <!-- Rule bar -->
  <div class="rule-bar ok" id="ruleBar">
    <div class="dot"></div>
    <span id="ruleText">Checking rules…</span>
  </div>

</div>

<script>
  let currentPair = 'XAUUSD';
  let currentMode = 'pct';

  function setPair(pair, btn) {
    currentPair = pair;
    document.querySelectorAll('.pair-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    calc();
  }

  function setMode(m) {
    currentMode = m;
    document.getElementById('btnPct').classList.toggle('active', m === 'pct');
    document.getElementById('btnAmt').classList.toggle('active', m === 'amt');
    document.getElementById('pctField').style.display = m === 'pct' ? 'flex' : 'none';
    document.getElementById('amtField').style.display = m === 'amt' ? 'flex' : 'none';
    calc();
  }

  function setRR(r, btn) {
    document.querySelectorAll('.rr-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const sl = parseFloat(document.getElementById('slPips').value) || 1;
    document.getElementById('tpPips').value = (sl * r).toFixed(1);
    calc();
  }

  function g(id) { return document.getElementById(id); }

  function calc() {
    const balance = parseFloat(g('balance').value) || 25000;
    const slPips  = parseFloat(g('slPips').value)  || 1;
    const tpPips  = parseFloat(g('tpPips').value)  || 1;

    let riskUSD;
    if (currentMode === 'pct') {
      const pct = parseFloat(g('riskPct').value) || 0.5;
      riskUSD = balance * pct / 100;
    } else {
      riskUSD = parseFloat(g('riskAmt').value) || 125;
    }

    const pipValPerLot = 10;
    const lotSize = riskUSD / (slPips * pipValPerLot);
    const units   = currentPair === 'XAUUSD'
      ? Math.round(lotSize * 100)
      : Math.round(lotSize * 100000);

    const rr     = tpPips / slPips;
    const profit = riskUSD * rr;
    const riskPct = (riskUSD / balance * 100);

    g('rLot').textContent   = lotSize.toFixed(2);
    g('rUnits').textContent = units.toLocaleString() + ' units';
    g('rRisk').textContent  = '$' + riskUSD.toFixed(2) + ' (' + riskPct.toFixed(2) + '%)';
    g('rProfit').textContent = '$' + profit.toFixed(2);

    const rrEl = g('rRR');
    rrEl.textContent = rr.toFixed(2) + 'R';
    rrEl.className = 'result-val ' + (rr >= 2 ? 'green' : rr >= 1 ? 'amber' : 'red');

    // Day check
    const dow  = new Date().getDay();
    const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const isMonFri = dow === 1 || dow === 5;
    const bar  = g('ruleBar');
    const txt  = g('ruleText');

    if (isMonFri) {
      bar.className = 'rule-bar warn';
      txt.textContent = 'No trading on ' + days[dow] + ' — your rules';
    } else if (rr < 2) {
      bar.className = 'rule-bar bad';
      txt.textContent = 'R:R ' + rr.toFixed(2) + 'R is below your 2R minimum';
    } else if (riskPct > 1) {
      bar.className = 'rule-bar warn';
      txt.textContent = 'Risk ' + riskPct.toFixed(2) + '% exceeds 1% rule';
    } else {
      bar.className = 'rule-bar ok';
      txt.textContent = days[dow] + ' — all rules pass. Good to go.';
    }
  }

  // Day badge
  function updateDayBadge() {
    const dow  = new Date().getDay();
    const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const badge = g('dayBadge');
    badge.textContent = days[dow];
    if (dow === 1 || dow === 5) badge.classList.add('warn');
  }

  // Service worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  updateDayBadge();
  calc();
</script>
</body>
</html>
